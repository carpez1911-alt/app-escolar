<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionar Actividades · Mi Clase 502</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-shell">
<nav class="navbar">
  <div class="brand">
    <div><div class="brand-title">Mi Clase 502</div><div class="brand-subtitle">Gestión de Actividades</div></div>
  </div>
  <div class="nav-actions" id="contenedor-menu-global"></div>
  </nav>

<main class="page">
  <section class="hero">
    <div>
      <div class="eyebrow">● Administración Académica</div>
      <h1>Gestor de Actividades</h1>
      <p>Filtra, revisa y administra las tareas programadas para tu grupo.</p>
    </div>
  </section>

  <!-- SECCIÓN DE FILTROS -->
  <section class="card">
    <div class="toolbar">
      <div><div class="toolbar-title"><i data-lucide="search" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Filtros de Búsqueda</div></div>
    </div>
    <div class="filter-grid">
      <div class="form-group" style="margin:0;">
        <label for="filtro-periodo">Periodo:</label>
        <select id="filtro-periodo" class="form-control" onchange="cargarActividades()"></select>
      </div>
      <div class="form-group" style="margin:0;">
        <label for="filtro-materia">Materia:</label>
        <select id="filtro-materia" class="form-control" onchange="cargarActividades()">
          <option value="">Todas las materias</option>
        </select>
      </div>
    </div>
  </section>

  <!-- LISTA DE ACTIVIDADES -->
  <section class="card task-card">
    <div class="toolbar">
      <div>
        <div class="toolbar-title"><i data-lucide="pin" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Actividades Encontradas</div>
        <div class="toolbar-meta" id="contador-actividades">Cargando...</div>
      </div>
    </div>
    <div class="task-list" id="contenedor-actividades">
      <div class="loading">Conectando con la base de datos…</div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<!-- MODAL DE EDICIÓN DE ACTIVIDAD -->
<div id="modal-editar" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-top:0; font-size:18px;">Editar Actividad</h3>
    
    <div class="form-group">
      <label>Título:</label>
      <input type="text" id="edit-titulo" class="form-control">
    </div>
    <div class="form-group">
      <label>Descripción:</label>
      <input type="text" id="edit-descripcion" class="form-control">
    </div>
    <div class="form-group">
      <label>Fecha de Vencimiento:</label>
      <input type="date" id="edit-fecha" class="form-control">
    </div>
    <div class="form-group">
      <label>Periodo:</label>
      <select id="edit-periodo" class="form-control"></select>
    </div>
    <div class="form-group">
      <label>Categoría (Tipología):</label>
      <select id="edit-categoria" class="form-control"></select>
    </div>
    
    <input type="hidden" id="edit-id">
    
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap;">
      <button class="secondary-btn" onclick="cerrarModalEditar()" style="flex:1; min-width:100px;">Cancelar</button>
      <button class="primary-btn" onclick="guardarEdicionActividad()" style="flex:2; min-width:160px;">Guardar Cambios</button>
    </div>
  </div>
</div>

</div>

<script>
// CONEXIÓN A SUPABASE
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtZ3lvYmdhaGl5dmd5c2pqaGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTU2OTcsImV4cCI6MjEwMjgzMTY5N30._o-3AMi4xzfYBVNAeUMpxX3rBL-qfXoFCuD6H_fQ1s0';
const clienteSupabase = window.clienteSupabaseCompartido;

const toast = mostrarToast;
let actividadesCargadas = [];
let totalPeriodos = 3;
let marcosPeriodos = [];
let categorias = [];

// 1. CARGAR FILTROS INICIALES
function getLeyendaCategoria(nombre) {
  if (nombre.includes("Aula")) return "Actividades en clase, tareas y revisión de cuadernos";
  if (nombre.includes("Producción")) return "Talleres estructurados, exposiciones y mesas redondas";
  if (nombre.includes("Final")) return "Evaluación final del periodo o recuperación";
  if (nombre.includes("Auto")) return "Rúbrica de responsabilidad y actitud";
  return "";
}

async function inicializarFiltros() {
  const [resCfg, resMat, resMarcos, resCat] = await Promise.all([
    clienteSupabase.from('configuracion_global').select('cantidad_periodos, periodo_actual').limit(1).single(),
    clienteSupabase.from('materias').select('id, nombre_materia').order('nombre_materia'),
    clienteSupabase.from('marcos_periodos').select('año, periodo, fecha_inicio, fecha_fin').order('periodo'),
    clienteSupabase.from('categorias_actividades').select('id, nombre, porcentaje').order('nombre')
  ]);

  // Poblar select de periodos
  categorias = resCat.data || [];
  totalPeriodos = resCfg.data ? (resCfg.data.cantidad_periodos || 3) : 3;
  marcosPeriodos = resMarcos.data || [];
  const periodoActual = resCfg.data ? resCfg.data.periodo_actual : 1;
  const selectPeriodo = document.getElementById('filtro-periodo');
  
  selectPeriodo.innerHTML = '<option value="">Todos los periodos</option>';
  for (let i = 1; i <= totalPeriodos; i++) {
    selectPeriodo.innerHTML += `<option value="${i}" ${i === periodoActual ? 'selected' : ''}>Periodo ${i}</option>`;
  }

  // Poblar select de materias
  if (resMat.data) {
    const selectMateria = document.getElementById('filtro-materia');
    resMat.data.forEach(m => {
      selectMateria.innerHTML += `<option value="${m.id}">${m.nombre_materia}</option>`;
    });
  }

  cargarActividades();
}

// 2. BUSCAR Y MOSTRAR ACTIVIDADES
async function cargarActividades() {
  const periodoFiltro = document.getElementById('filtro-periodo').value;
  const materiaFiltro = document.getElementById('filtro-materia').value;
  const contenedor = document.getElementById('contenedor-actividades');
  const contador = document.getElementById('contador-actividades');

  contenedor.innerHTML = '<div class="loading">Buscando actividades...</div>';

  let consulta = clienteSupabase.from('tareas').select('*, materias(nombre_materia), categorias_actividades(nombre, porcentaje)').order('fecha_vencimiento', { ascending: false });

  if (periodoFiltro !== "") {
    consulta = consulta.eq('periodo', periodoFiltro);
  }
  if (materiaFiltro !== "") {
    consulta = consulta.eq('materia_id', materiaFiltro);
  }

  const { data, error } = await consulta;

  if (error) {
    contenedor.innerHTML = '<div class="empty"><div class="empty-icon"><i data-lucide="x-circle" style="width: 32px; height: 32px; display: inline-block; vertical-align: middle;"></i></div>Error al cargar las actividades.</div>';
    return;
  }

  contador.textContent = `${data.length} actividad(es) encontrada(s)`;
  actividadesCargadas = data;

  if (data.length === 0) {
    contenedor.innerHTML = '<div class="empty"><div class="empty-icon"><i data-lucide="inbox" style="width: 32px; height: 32px; display: inline-block; vertical-align: middle;"></i></div>No hay actividades registradas para estos filtros.</div>';
    return;
  }

  contenedor.innerHTML = '';
  data.forEach(tarea => {
    const nombreMateria = tarea.materias ? tarea.materias.nombre_materia : 'General';
    const nombreCat = tarea.categorias_actividades ? `${tarea.categorias_actividades.nombre} (${tarea.categorias_actividades.porcentaje}%)` : 'Sin categoría';
    const div = document.createElement('div');
    div.className = 'task';
    div.style.cssText = 'display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;';
    div.innerHTML = `
      <div class="datos-tarea" style="flex:1; min-width:0;">
        <span style="display: inline-block; background-color: var(--warning); color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-bottom: 5px;">${nombreMateria} - Periodo ${tarea.periodo}</span>
        <span style="display: inline-block; background-color: var(--primary); color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-bottom: 5px; margin-left: 5px;">${nombreCat}</span>
        <div style="font-weight: 700;">${tarea.titulo}</div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 4px;">${tarea.descripcion || 'Sin descripción'}</div>
        <div style="font-size: 12px; font-weight: 800; color: var(--primary); margin-top: 4px;">Vence: ${formatearFechaCorta(tarea.fecha_vencimiento)}</div>
      </div>
      <div style="display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap;">
        <button class="secondary-btn" onclick="editarActividad(${tarea.id})" style="min-width:80px;"><i data-lucide="edit-2" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Editar</button>
        <button class="secondary-btn" style="color: var(--danger); border-color: #fca5a5; min-width:90px;" onclick="eliminarActividad(${tarea.id})"><i data-lucide="trash-2" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Eliminar</button>
      </div>
    `;
    contenedor.appendChild(div);
  });
  lucide.createIcons();
}

// 3. ELIMINAR ACTIVIDAD
async function eliminarActividad(id) {
  const [{ count: cantidadCalificaciones, error: errorCalificaciones }, { count: cantidadEntregas, error: errorEntregas }] = await Promise.all([
    clienteSupabase.from('calificaciones').select('id', { count: 'exact', head: true }).eq('tarea_id', id),
    clienteSupabase.from('entregas_tareas').select('id', { count: 'exact', head: true }).eq('tarea_id', id)
  ]);
  if (errorCalificaciones || errorEntregas) {
    console.error(errorCalificaciones || errorEntregas);
    toast('No se puede comprobar el historial; la actividad no fue eliminada.');
    return;
  }
  if ((cantidadCalificaciones || 0) > 0 || (cantidadEntregas || 0) > 0) {
    toast('No se puede eliminar: la actividad tiene calificaciones o entregas asociadas.');
    return;
  }
  if (confirm('¿Estás seguro de que deseas eliminar esta actividad?')) {
    const { error } = await clienteSupabase.from('tareas').delete().eq('id', id);
    if(error) {
      toast(`Error al eliminar: ${error.message}`);
    } else {
      toast('<i data-lucide="trash-2" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i>️ Actividad eliminada correctamente.');
      cargarActividades();
    }
  }
}

function cerrarModalEditar() {
  document.getElementById('modal-editar').classList.remove('open');
}

function editarActividad(id) {
  const actividad = actividadesCargadas.find(item => Number(item.id) === Number(id));
  if (!actividad) {
    toast('No se encontró la actividad para editar.');
    return;
  }
  
  document.getElementById('edit-id').value = actividad.id;
  document.getElementById('edit-titulo').value = actividad.titulo || '';
  document.getElementById('edit-descripcion').value = actividad.descripcion || '';
  document.getElementById('edit-fecha').value = actividad.fecha_vencimiento || '';
  
  const selectPeriodo = document.getElementById('edit-periodo');
  selectPeriodo.innerHTML = '';
  for(let i=1; i<=totalPeriodos; i++) {
    selectPeriodo.innerHTML += `<option value="${i}">Periodo ${i}</option>`;
  }
  selectPeriodo.value = actividad.periodo || 1;
  
  const selectCat = document.getElementById('edit-categoria');
  selectCat.innerHTML = '';
  categorias.forEach(c => {
    selectCat.innerHTML += `<option value="${c.id}" title="${getLeyendaCategoria(c.nombre)}">${c.nombre} (${c.porcentaje}%)</option>`;
  });
  selectCat.value = actividad.categoria_id || '';

  document.getElementById('modal-editar').classList.add('open');
}

async function guardarEdicionActividad() {
  const id = document.getElementById('edit-id').value;
  const titulo = document.getElementById('edit-titulo').value.trim();
  const descripcion = document.getElementById('edit-descripcion').value.trim();
  const fecha = document.getElementById('edit-fecha').value;
  const periodo = document.getElementById('edit-periodo').value;
  const categoria_id = document.getElementById('edit-categoria').value;
  
  if (!titulo || !fecha || !periodo || !categoria_id) {
    toast('Todos los campos principales y la tipología son obligatorios.');
    return;
  }
  
  const periodoNumero = parseInt(periodo, 10);
  const catNumero = parseInt(categoria_id, 10);
  
  const marco = marcosPeriodos.find(item => Number(item.periodo) === periodoNumero);
  if (!marco) {
    toast('No existe un marco académico para el periodo seleccionado.');
    return;
  }
  if (fecha < marco.fecha_inicio || fecha > marco.fecha_fin) {
    toast(`La fecha debe estar entre ${formatearFechaCorta(marco.fecha_inicio)} y ${formatearFechaCorta(marco.fecha_fin)}.`);
    return;
  }
  
  const { error } = await clienteSupabase.from('tareas').update({ 
    titulo: titulo, 
    descripcion: descripcion, 
    fecha_vencimiento: fecha, 
    periodo: periodoNumero, 
    categoria_id: catNumero 
  }).eq('id', id);
  
  if (error) {
    console.error(error);
    toast(`No fue posible editar la actividad: ${error.message}`);
    return;
  }
  
  cerrarModalEditar();
  toast('<i data-lucide="check" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Actividad actualizada correctamente.');
  cargarActividades();
}

// Iniciar la pantalla
inicializarFiltros();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
