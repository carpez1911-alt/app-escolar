<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión · Mi Clase</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="app.js"></script>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: var(--bg);
    padding: 16px;
  }
  .login-card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .login-card .brand-mark {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: inline-block;
  }
  .login-card h1 {
    font-size: 1.5rem;
    color: var(--text-dark);
    margin-bottom: 1.5rem;
  }
  .form-group {
    text-align: left;
    margin-bottom: 1rem;
  }
  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--text-dark);
  }
  .form-control {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    min-height: 48px;
  }
  .btn-login {
    width: 100%;
    padding: 0.75rem;
    background-color: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    min-height: 48px;
  }
  .btn-login:hover {
    background-color: var(--primary-dark);
  }
</style>
</head>
<body>
<div class="login-card">
  <i data-lucide="graduation-cap" class="brand-mark" style="width: 48px; height: 48px; color: var(--primary);"></i>
  <div style="font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;">Institución Educativa Nuestra Señora del Pilar</div>
  <h1 style="margin-top: 4px; margin-bottom: 1.2rem; font-size: 1.4rem;">Sistema Integrado de Gestión</h1>
  
  <form id="login-form">
    <div id="login-alert-box" style="display: none; padding: 10px 14px; margin-bottom: 1rem; border-radius: 8px; font-size: 0.9rem; text-align: left; background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <i data-lucide="alert-triangle" style="width: 18px; height: 18px; flex-shrink: 0; color: #dc2626;"></i>
        <span id="login-alert-text">Error al iniciar sesión</span>
      </div>
    </div>
    
    <div class="form-group">
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" class="form-control" placeholder="docente@escuela.edu" required>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login" id="btn-submit">
      <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
      Ingresar
    </button>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
  // Inicializar iconos de Lucide
  lucide.createIcons();

  function mostrarAlertaLogin(mensaje, tipo = 'error') {
    const alertBox = document.getElementById('login-alert-box');
    const alertText = document.getElementById('login-alert-text');
    if (!alertBox || !alertText) return;
    
    alertText.textContent = mensaje;
    if (tipo === 'error') {
      alertBox.style.background = '#fee2e2';
      alertBox.style.borderColor = '#fca5a5';
      alertBox.style.color = '#991b1b';
    } else {
      alertBox.style.background = '#e0f2fe';
      alertBox.style.borderColor = '#bae6fd';
      alertBox.style.color = '#0369a1';
    }
    alertBox.style.display = 'block';
    lucide.createIcons();
  }

  function ocultarAlertaLogin() {
    const alertBox = document.getElementById('login-alert-box');
    if (alertBox) alertBox.style.display = 'none';
  }

  function traducirErrorAuth(errorMsg) {
    if (!errorMsg) return 'Error desconocido al autenticar.';
    const lower = errorMsg.toLowerCase();
    if (lower.includes('invalid login credentials') || lower.includes('invalid credentials')) {
      return 'Credenciales incorrectas. Verifica tu correo y contraseña.';
    }
    if (lower.includes('email not confirmed')) {
      return 'El correo no ha sido confirmado aún.';
    }
    if (lower.includes('too many requests') || lower.includes('rate limit')) {
      return 'Demasiados intentos fallidos. Espera un momento antes de reintentar.';
    }
    if (lower.includes('failed to fetch') || lower.includes('network') || lower.includes('timeout')) {
      return 'Error de conexión con el servidor. Revisa tu acceso a internet.';
    }
    return errorMsg;
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarAlertaLogin();
    const btn = document.getElementById('btn-submit');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader" class="lucide-spin" style="width: 18px; height: 18px;"></i> Ingresando...';
    lucide.createIcons();

    let timeoutId = null;
    try {
      // Timeout preventivo de 10 segundos
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => reject(new Error('Tiempo de espera agotado al conectar con el servidor')), 10000);
      });

      const authPromise = clienteSupabaseCompartido.auth.signInWithPassword({
        email,
        password,
      });

      const { data, error } = await Promise.race([authPromise, timeoutPromise]);
      clearTimeout(timeoutId);

      if (error) {
        const errorTraducido = traducirErrorAuth(error.message);
        mostrarAlertaLogin(errorTraducido);
        mostrarToast(errorTraducido, 'error');
      } else {
        mostrarToast('Ingreso exitoso. Redirigiendo...', 'success');
        window.location.href = 'dashboard.html';
      }
    } catch (err) {
      if (timeoutId) clearTimeout(timeoutId);
      const errorMsg = traducirErrorAuth(err.message || 'Fallo de conexión');
      mostrarAlertaLogin(errorMsg);
      mostrarToast(errorMsg, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Ingresar';
      lucide.createIcons();
    }
  });

  // Redirigir si ya está logueado
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data: { session } } = await clienteSupabaseCompartido.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    } catch (err) {
      console.warn('Verificación de sesión omitida o fallida:', err);
    }
  });
</script>
</body>
</html>
