<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistencia · Mi Clase 502</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
<nav class="navbar">
  <div class="brand">
    <div class="brand-mark">🎓</div>
    <div><div class="brand-title">Mi Clase 502</div><div class="brand-subtitle">Gestión docente</div></div>
  </div>
  <div class="nav-actions">
    <a class="nav-btn" href="dashboard.html">🏠 Panel</a>
    <div class="menu-wrap" id="menuWrap">
      <button class="menu-btn" id="menuBtn">☰ Opciones</button>
      <div class="menu-panel">
        <a href="dashboard.html">🏠 Panel principal</a>
        <a href="index.html">📋 Control de asistencia</a>
      </div>
    </div>
  </div>
</nav>

<main class="page">
  <section class="hero">
    <div>
      <div class="eyebrow">● Registro diario</div>
      <h1>Control de asistencia</h1>
      <p>Registra la jornada de tu grupo de forma rápida y visual.</p>
    </div>
    <div class="date-pill">📅 <span id="fecha-hoy">Cargando fecha...</span></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <div><div class="toolbar-title">Estudiantes</div><div class="toolbar-meta" id="contador">Cargando grupo...</div></div>
      <button class="secondary-btn" onclick="marcarTodosPresentes()">⚡ Todos presentes</button>
    </div>
    <div class="students" id="lista-estudiantes">
      <div class="loading">Conectando con la base de datos…</div>
    </div>
  </section>

  <div class="save-bar">
    <div class="legend">
      <span><i class="dot p"></i>Presente</span>
      <span><i class="dot e"></i>Excusa</span>
      <span><i class="dot t"></i>Tardanza</span>
      <span><i class="dot a"></i>Ausente</span>
    </div>
    <button class="primary-btn" style="width:auto;" onclick="guardarAsistencia()">💾 Guardar asistencia</button>
  </div>
</main>
<div class="toast" id="toast"></div>
</div>

<script>
// LLAVES CORREGIDAS
const SUPABASE_URL = 'https://qmgyobgahiyvgysjjhax.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtZ3lvYmdhaGl5dmd5c2pqaGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTU2OTcsImV4cCI6MjEwMjgzMTY5N30._o-3AMi4xzfYBVNAeUMpxX3rBL-qfXoFCuD6H_fQ1s0';
const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let asistenciasTemporales = {};

const toast=(msg)=>{const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>el.style.display='none',3000)};
document.getElementById('fecha-hoy').textContent=new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('menuWrap').classList.toggle('open'));
document.addEventListener('click',e=>{if(!document.getElementById('menuWrap').contains(e.target))document.getElementById('menuWrap').classList.remove('open')});

async function cargarEstudiantes(){
  const {data,error} = await clienteSupabase.from('estudiantes').select('*').eq('estado','Activo').eq('año_lectivo',2026).order('id');
  const cont = document.getElementById('lista-estudiantes');
  
  if(error){cont.innerHTML='<div class="empty"><div class="empty-icon">⚠️</div>No fue posible cargar los estudiantes.</div>'; toast('Error al conectar con Supabase'); return;}
  
  document.getElementById('contador').textContent=`${data.length} estudiante${data.length===1?'':'s'} activos`;
  cont.innerHTML='';
  
  data.forEach(e=>{
    const row=document.createElement('div'); row.className='student'; row.dataset.id=e.id;
    const info=document.createElement('div'); info.className='student-info';
    const avatar=document.createElement('div'); avatar.className='avatar'; avatar.textContent=(e.nombre_completo||'?').trim().charAt(0).toUpperCase();
    const text=document.createElement('div');
    const name=document.createElement('div'); name.className='student-name'; name.textContent=e.nombre_completo||'Sin nombre';
    const id=document.createElement('div'); id.className='student-id'; id.textContent=`Estudiante #${e.id}`;
    text.append(name,id); info.append(avatar,text);
    
    const grid=document.createElement('div'); grid.className='status-grid';
    [['P','Presente','p'],['E','Excusa','e'],['T','Tardanza','t'],['A','Ausente','a']].forEach(([label,title,key])=>{
      const b=document.createElement('button'); b.className='status-btn'; b.textContent=label; b.title=title;
      b.onclick=()=>seleccionarEstado(b,key,e.id); grid.appendChild(b);
    });
    row.append(info,grid); cont.appendChild(row);
  });
}

function seleccionarEstado(btn,estado,id){
  const row=btn.closest('.student');
  row.querySelectorAll('.status-btn').forEach(b=>b.className='status-btn');
  btn.classList.add('selected-'+estado);
  asistenciasTemporales[id]=estado.toUpperCase();
}

function marcarTodosPresentes(){
  document.querySelectorAll('.student').forEach(row=>{
    const id=row.dataset.id;
    const btn=row.querySelector('.status-btn'); // Selecciona el primero que es P
    seleccionarEstado(btn,'p',id);
  });
  toast('⚡ Todos marcados como presentes');
}

async function guardarAsistencia(){
  const datos = Object.entries(asistenciasTemporales).map(([id,estado])=>({estudiante_id:id, estado:estado}));
  
  if(!datos.length){toast('⚠️ Selecciona al menos un estado'); return;}
  
  const {error} = await clienteSupabase.from('asistencia').insert(datos);
  
  if(error){
      // Si salta el error del candado "Una vez al día" que creamos antes
      if(error.code === '23505') { toast('⚠️ Ya tomaste asistencia hoy para estos alumnos'); }
      else { toast('Error: No se pudo guardar la asistencia'); console.error(error); }
      return;
  }
  
  // Limpiar memoria y pantalla tras guardar con éxito
  asistenciasTemporales={};
  document.querySelectorAll('.status-btn').forEach(b=>b.className='status-btn');
  toast('✓ Asistencia guardada correctamente');
}

cargarEstudiantes();
</script>
</body>
</html>
