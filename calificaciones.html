<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calificaciones · Mi Clase</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  /* Tabla de calificaciones */
  #tabla-notas { font-size: 13px; text-align: center; white-space: nowrap; }
  #tabla-notas th, #tabla-notas td { padding: 12px 10px; border: 1px solid var(--border); }
  #tabla-notas th { background-color: var(--primary-soft); color: var(--primary-dark); font-weight: 800; position: sticky; top: 0; z-index: 2; white-space: normal; min-width: 80px; max-width: 140px; line-height: 1.2; word-wrap: break-word; }
  #tabla-notas td.text-left { text-align: left; font-weight: 600; color: var(--text); position: sticky; left: 0; background: white; z-index: 3; box-shadow: 2px 0 5px rgba(0,0,0,0.05); min-width: 140px; max-width: 200px; white-space: normal; }
  #tabla-notas th.text-left { text-align: left; position: sticky; left: 0; z-index: 4; background-color: var(--primary-soft); }
  .promedio-col { background-color: #dcfce7; font-weight: bold; color: #15803d; }
  
  /* Celdas editables (tipo Excel) */
  .celda-nota { background-color: #f8fafc; transition: 0.2s; cursor: text; min-width: 60px; font-weight: bold; }
  .celda-nota:hover { background-color: #e2e8f0; outline: 2px solid var(--primary); }
  .celda-nota:focus { background-color: #fff; outline: 2px solid var(--primary); outline-offset: -2px; }
  
  .btn-wa { background-color: #25D366; color: white; border-radius: 4px; padding: 6px 12px; font-weight: 600; font-size: 13px; box-shadow: 0 2px 4px rgba(37,211,102,0.3); transition: 0.2s; border: none; cursor: pointer; }
  .btn-wa:hover { background-color: #128C7E; transform: translateY(-1px); }
  
  @media (max-width: 768px) {
    .btn-wa { font-size: 0; padding: 10px; border-radius: 50%; min-width: 44px; display: inline-flex; justify-content: center; align-items: center; }
    .btn-wa i { margin-right: 0 !important; }
    #tabla-notas td.text-left { min-width: 120px; max-width: 140px; }
  }
</style>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<!-- Botón Flotante de Regreso -->
<button onclick="window.location.href='dashboard.html'" class="fab-back" title="Regresar al Panel Principal">
  <i data-lucide="arrow-left" style="width: 24px; height: 24px;"></i>
</button>

<div class="app-shell">
<nav class="navbar">
  <div class="brand">
    <i data-lucide="graduation-cap" class="brand-mark" style="color: var(--primary); width: 32px; height: 32px;"></i>
    <div><div class="brand-title">Mi Clase</div><div class="brand-subtitle">Consolidado de Notas</div></div>
  </div>
  <div class="nav-actions" id="contenedor-menu-global"></div>
  </nav>

<main class="page">
  <section class="hero" style="margin-bottom: 15px;">
    <div>
      <div class="eyebrow">● Rendimiento Académico</div>
      <h1>Calificar Actividades</h1>
      <p>Asigna notas a los estudiantes según la materia y actividad seleccionada.</p>
    </div>
  </section>

  <!-- FILTROS EN CARD RESPONSIVE -->
  <section class="card" style="padding: 0;">
    <div class="toolbar">
      <div><div class="toolbar-title">Filtros de selección</div></div>
    </div>
    <div class="filter-grid">
      <div class="form-group" style="margin:0;">
        <label for="filtro-periodo">Periodo</label>
        <select id="filtro-periodo" class="form-control" onchange="cargarPlanilla()">
            <option value="">Cargando...</option>
        </select>
      </div>
      <div class="form-group" style="margin:0;">
        <label for="filtro-materia" id="label-materia">Materia</label>
        <select id="filtro-materia" class="form-control" onchange="cargarPlanilla()">
          <option value="">Selecciona una materia...</option>
        </select>
      </div>
      <div class="form-group" style="margin:0;">
        <label for="filtro-actividad" id="label-actividad">Actividad</label>
        <select id="filtro-actividad" class="form-control" onchange="renderizarPlanillaCalificar()">
          <option value="">Cargando...</option>
        </select>
      </div>
      <div class="filter-actions" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <button class="primary-btn" id="btn-guardar-notas" type="button" onclick="guardarNotas()"><i data-lucide="save" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Guardar</button>
        <button class="secondary-btn" id="btn-copiar-columna" type="button" title="Copiar columna" onclick="copiarColumna()" style="padding: 10px; min-width: auto;"><i data-lucide="copy" style="width: 18px; height: 18px; display: block;"></i></button>
        <button class="secondary-btn" id="btn-rellenar-uno" type="button" title="Rellenar vacíos con 1.0" onclick="rellenarConUno()" style="padding: 10px; min-width: auto;"><i data-lucide="edit-3" style="width: 18px; height: 18px; display: block;"></i></button>
        <button class="primary-btn" id="btn-reporte-general" type="button" style="background-color: #25D366; border-color: #25D366; color: white;" onclick="enviarReporteGeneralCalificaciones()"><i data-lucide="users" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Reporte general</button>
      </div>
    </div>
  </section>

  <section class="card" style="padding: 0;">
    <div class="table-container">
      <table id="tabla-notas">
        <thead>
          <tr id="cabecera-materias">
            <th class="text-left" rowspan="2">Estudiante</th>
            <th class="promedio-col" rowspan="2">Definitiva</th>
            <th rowspan="2">Reporte</th>
          </tr>
          <tr id="cabecera-actividades" hidden></tr>
        </thead>
        <tbody id="cuerpo-planilla">
            <tr><td colspan="15" class="loading">Conectando con la base de datos...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
</div>

<script>
// CONEXIÓN
const clienteSupabase = window.clienteSupabaseCompartido;

const toast = mostrarToast;

let listaTareas = [];
let listaEstudiantes = [];
let listaMaterias = [];
let notasCargadas = [];
let promediosCargados = [];

function crearCelda(tag, texto, clase = '') {
  const celda = document.createElement(tag);
  celda.textContent = texto;
  if (clase) celda.className = clase;
  return celda;
}

function configurarPeriodos(cantidadPeriodos) {
  const selector = document.getElementById('filtro-periodo');
  const cantidad = [3, 4].includes(Number(cantidadPeriodos)) ? Number(cantidadPeriodos) : 3;
  selector.innerHTML = '';
  for (let periodo = 1; periodo <= cantidad; periodo += 1) {
    selector.appendChild(new Option(`Periodo ${periodo}`, periodo));
  }
}

function configurarMaterias(materias) {
  const selector = document.getElementById('filtro-materia');
  selector.innerHTML = '<option value="">Selecciona una materia...</option>';
  materias.forEach(materia => selector.appendChild(new Option(materia.nombre_materia, materia.id)));
}

function promedioDeFila(fila) {
  return fila.querySelector('.promedio-materia')?.textContent || '-';
}

function enviarWhatsApp(nombre, promedio, periodo) {
  if (promedio === '-') {
    mostrarToast('El estudiante todavía no tiene calificaciones.');
    return;
  }
  const materia = document.getElementById('filtro-materia').selectedOptions[0]?.textContent || '';
  const mensaje = ` *Reporte de Calificaciones*\n Estudiante: ${nombre}\n📖 Materia: ${materia}\n📅 Periodo: ${periodo}\n\n📊 *Promedio Definitivo:* ${promedio}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, '_blank');
}

function enviarReporteGeneralCalificaciones() {
  const materiaSelect = document.getElementById('filtro-materia');
  const materia = materiaSelect.selectedOptions[0]?.textContent;
  const periodo = document.getElementById('filtro-periodo').value;

  if (!materiaSelect.value || !periodo) {
    toast('<i data-lucide="alert-triangle" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i>️ Selecciona una materia para generar el reporte general.');
    return;
  }
  if (!listaEstudiantes || listaEstudiantes.length === 0) {
    toast('<i data-lucide="alert-triangle" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i>️ No hay estudiantes cargados.');
    return;
  }

  let msj = ` *Reporte Consolidado de Notas*\n📖 Materia: ${materia}\n📅 Periodo: ${periodo}\n\n`;
  
  listaEstudiantes.forEach(est => {
    const pro = promediosCargados.find(p => String(p.estudiante_id) === String(est.id));
    const promedio = (pro && pro.promedio_definitivo !== null) ? pro.promedio_definitivo : 'Sin notas';
    msj += `* ${est.nombre_completo}: *${promedio}*\n`;
  });

  window.open(`https://wa.me/?text=${encodeURIComponent(msj)}`, '_blank');
}

function actualizarPromedios(fila) {
  // El cálculo se movió a la vista en BD. Solo recargar al guardar.
}

function mostrarSinActividades() {
  document.getElementById('cabecera-materias').innerHTML = '<th class="text-left">Estudiante</th><th class="promedio-col">Definitiva</th><th>Reporte</th>';
  document.getElementById('cabecera-actividades').hidden = true;
  document.getElementById('cuerpo-planilla').innerHTML = '<tr><td colspan="3" class="empty"><div class="empty-icon"><i data-lucide="book" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i></div>No hay actividades creadas para este periodo.<br>Primero crea tareas desde el Panel Principal.</td></tr>';
}

// FUNCIÓN 1: DIBUJAR LA PLANILLA
async function cargarPlanilla() {
  const periodo = document.getElementById('filtro-periodo').value;
  const materiaId = document.getElementById('filtro-materia').value;
  const selectorActividad = document.getElementById('filtro-actividad');
  const tbody = document.getElementById('cuerpo-planilla');
  const thead = document.getElementById('cabecera-materias');
  const subthead = document.getElementById('cabecera-actividades');
  
  if (!periodo || !materiaId) {
    thead.innerHTML = '<th class="text-left">Estudiante</th><th class="promedio-col">Definitiva</th><th>Reporte</th>';
    subthead.hidden = true;
    tbody.innerHTML = '<tr><td colspan="3" class="empty">Selecciona una materia para comenzar a calificar.</td></tr>';
    selectorActividad.innerHTML = '<option value="">Selecciona una materia primero...</option>';
    return;
  }
  tbody.innerHTML = `<tr><td colspan="15" class="loading">Cargando actividades del Periodo ${periodo}...</td></tr>`;
  const [resEst, resTareas, resNotas, resPromedios] = await Promise.all([
    clienteSupabase.from('estudiantes').select('id, nombre_completo').eq('estado', 'Activo').order('id'),
    clienteSupabase.from('tareas').select('id, titulo, descripcion, materia_id, periodo').eq('materia_id', materiaId).eq('periodo', periodo).order('fecha_vencimiento'),
    clienteSupabase.from('calificaciones').select('id, estudiante_id, materia_id, tarea_id, periodo, nota').eq('materia_id', materiaId).eq('periodo', periodo),
    clienteSupabase.from('v_promedios_estudiantes').select('estudiante_id, promedio_definitivo').eq('materia_id', materiaId).eq('periodo', periodo)
  ]);
  if (resEst.error || resTareas.error || resNotas.error || resPromedios?.error) { 
    console.error('Error est:', resEst.error);
    console.error('Error tareas:', resTareas.error);
    console.error('Error notas:', resNotas.error);
    console.error('Error promedios:', resPromedios?.error);
    toast('Error al cargar la planilla'); 
    return; 
  }
  
  listaEstudiantes = resEst.data || [];
  listaTareas = resTareas.data || [];
  notasCargadas = resNotas.data || [];
  promediosCargados = resPromedios?.data || [];
  
  if (!listaTareas.length) { 
    mostrarSinActividades(); 
    selectorActividad.innerHTML = '<option value="">Sin actividades</option>';
    return; 
  }

  const selectedTareaId = selectorActividad.value;
  selectorActividad.innerHTML = '<option value="">Selecciona una actividad...</option>';
  
  if (listaTareas.length === 0) {
    selectorActividad.innerHTML = '<option value="">Sin actividades</option>';
  } else {
    selectorActividad.innerHTML += '<option value="todas">Todas las actividades</option>';
    listaTareas.forEach(tarea => {
      const notasDeTarea = notasCargadas.filter(n => n.tarea_id === tarea.id && n.nota !== null && n.nota !== undefined);
      const completada = (notasDeTarea.length >= listaEstudiantes.length) && (listaEstudiantes.length > 0);
      const estado = completada ? ' <i data-lucide="check-circle" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> (Calificada)' : '';
      selectorActividad.innerHTML += `<option value="${tarea.id}">${tarea.titulo}${estado}</option>`;
    });
  }
  
  if (listaTareas.some(t => String(t.id) === selectedTareaId)) {
    selectorActividad.value = selectedTareaId;
  } else {
    selectorActividad.value = "";
  }

  renderizarPlanillaCalificar();
}

function renderizarPlanillaCalificar() {
  const tbody = document.getElementById('cuerpo-planilla');
  const thead = document.getElementById('cabecera-materias');
  const subthead = document.getElementById('cabecera-actividades');
  const materiaId = document.getElementById('filtro-materia').value;
  const tareaSeleccionadaId = document.getElementById('filtro-actividad').value;
  const periodo = document.getElementById('filtro-periodo').value;

  if (!tareaSeleccionadaId) {
    thead.innerHTML = '<th class="text-left">Estudiante</th><th class="promedio-col">Definitiva</th><th>Reporte</th>';
    subthead.hidden = true;
    tbody.innerHTML = '<tr><td colspan="3" class="empty">Selecciona una actividad para calificarla.</td></tr>';
    return;
  }

  let tareasARenderizar = [];
  if (tareaSeleccionadaId === 'todas') {
    tareasARenderizar = listaTareas;
  } else {
    const tarea = listaTareas.find(t => String(t.id) === tareaSeleccionadaId);
    if(tarea) tareasARenderizar.push(tarea);
  }

  thead.innerHTML = '<th class="text-left">Estudiante</th>';
  subthead.innerHTML = '';
  subthead.hidden = true;
  
  tareasARenderizar.forEach(tarea => {
     const encabezado = crearCelda('th', tarea.titulo || 'Actividad');
     encabezado.title = tarea.descripcion ? `${tarea.titulo}\n\n${tarea.descripcion}` : (tarea.titulo || 'Actividad');
     thead.appendChild(encabezado);
  });

  thead.insertAdjacentHTML('beforeend', '<th class="promedio-col">Definitiva</th><th>Reporte</th>');
  tbody.innerHTML = '';
  
  listaEstudiantes.forEach(estudiante => {
    const fila = document.createElement('tr');
    fila.appendChild(crearCelda('td', estudiante.nombre_completo, 'text-left'));
    
    tareasARenderizar.forEach(tarea => {
      const nota = notasCargadas.find(item => item.estudiante_id === estudiante.id && item.tarea_id === tarea.id);
      const celda = crearCelda('td', nota?.nota ?? '', 'celda-nota');
      celda.contentEditable = 'true';
      celda.dataset.estudiante = estudiante.id;
      celda.dataset.materia = materiaId;
      celda.dataset.tarea = tarea.id;
      
      celda.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const nextRow = e.target.closest('tr').nextElementSibling;
          if (nextRow) {
            const cellIndex = Array.from(e.target.closest('tr').children).indexOf(e.target);
            const nextCell = nextRow.children[cellIndex];
            if (nextCell && nextCell.classList.contains('celda-nota')) {
              nextCell.focus();
              const selection = window.getSelection();
              const range = document.createRange();
              range.selectNodeContents(nextCell);
              selection.removeAllRanges();
              selection.addRange(range);
            }
          }
        }
      });

      celda.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text');
        const lines = pasteData.split(/\r?\n/).filter(l => l.trim() !== '');
        const cellIndex = Array.from(e.target.closest('tr').children).indexOf(e.target);
        if (lines.length > 1) {
          let currentRow = e.target.closest('tr');
          for (let i = 0; i < lines.length; i++) {
            if (!currentRow) break;
            const currentCell = currentRow.children[cellIndex];
            if (currentCell && currentCell.classList.contains('celda-nota')) {
               let val = lines[i].trim().replace(',', '.');
               if(!isNaN(Number(val)) && val !== '') currentCell.textContent = val;
            }
            currentRow = currentRow.nextElementSibling;
          }
        } else if (lines.length === 1) {
          let val = lines[0].trim().replace(',', '.');
          if(!isNaN(Number(val)) && val !== '') e.target.textContent = val;
        }
      });

      fila.appendChild(celda);
    });

    const pro = promediosCargados.find(p => String(p.estudiante_id) === String(estudiante.id));
    const promedioMateria = crearCelda('td', pro ? pro.promedio_definitivo : '-', 'promedio-col promedio-materia');
    promedioMateria.dataset.materia = materiaId;
    fila.appendChild(promedioMateria);

    const acciones = crearCelda('td', '', 'acciones-celda');
    const botonReporte = document.createElement('button');
    botonReporte.className = 'btn-wa';
    botonReporte.innerHTML = '<i data-lucide="smartphone" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Enviar';
    botonReporte.type = 'button';
    const nombreMateria = document.getElementById('filtro-materia').selectedOptions[0]?.textContent || 'la materia';
    botonReporte.addEventListener('click', () => enviarWhatsApp(estudiante.nombre_completo, promedioDeFila(fila), periodo, nombreMateria));
    acciones.appendChild(botonReporte);
    fila.appendChild(acciones);
    tbody.appendChild(fila);
    actualizarPromedios(fila);
  });
}

// FUNCIÓN 2: GUARDAR LAS NOTAS ESCRITAS
async function guardarNotas() {
    const botonGuardar = document.querySelector('button[onclick="guardarNotas()"]');
    if (botonGuardar?.disabled) return;
    if (!document.getElementById('filtro-materia').value) {
      toast('Selecciona una materia primero.');
      return;
    }
    botonGuardar.disabled = true;
    toast('Guardando calificaciones...');
    const periodo = document.getElementById('filtro-periodo').value;
    const celdas = document.querySelectorAll('.celda-nota');
    let datosAGuardar = [];

    // Recorremos todas las celdas de la tabla para ver si tienen texto
    celdas.forEach(celda => {
        let texto = celda.textContent.trim();
        // Cambiamos comas por puntos por si el teclado está en español (ej. 8,5 -> 8.5)
        texto = texto.replace(',', '.'); 
        
        if (texto !== '') {
            let notaNumerica = Number(texto);
            // Si lo que escribieron es un número válido, lo preparamos para guardar
            if (!isNaN(notaNumerica)) {
                if (notaNumerica < 0 || notaNumerica > 10) return;
                datosAGuardar.push({
                    estudiante_id: Number(celda.dataset.estudiante),
                    materia_id: Number(celda.dataset.materia),
                    tarea_id: Number(celda.dataset.tarea),
                    periodo: parseInt(periodo),
                    nota: notaNumerica
                });
            }
        }
    });

    if (datosAGuardar.length === 0) {
      toast('<i data-lucide="alert-triangle" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i>️ Escribe notas válidas entre 0 y 10.');
        botonGuardar.disabled = false;
        return;
    }

    // El comando UPSERT inserta la nota nueva o actualiza la vieja automáticamente
    let { error } = await clienteSupabase
      .from('calificaciones')
      .upsert(datosAGuardar, { onConflict: 'estudiante_id, materia_id, periodo, tarea_id' });

    if (error) {
        console.error('Error al guardar calificaciones:', error);
        toast('Error DB: ' + (error.message || 'No fue posible guardar las calificaciones.'));
    } else {
        toast('<i data-lucide="check" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Calificaciones guardadas correctamente.');
        await cargarPlanilla();
    }
      botonGuardar.disabled = false;
}

async function inicializarPlanilla() {
  const urlParams = new URLSearchParams(window.location.search);
  const paramMateria = urlParams.get('materia_id');
  const paramPeriodo = urlParams.get('periodo');
  const paramTarea = urlParams.get('tarea_id');

  const [resConfig, resMaterias] = await Promise.all([
    clienteSupabase.from('configuracion_global').select('cantidad_periodos, periodo_actual').limit(1).single(),
    clienteSupabase.from('materias').select('id, nombre_materia').order('nombre_materia')
  ]);
  if (resConfig.error) toast('No se pudo leer la configuración; se usarán 3 periodos.');
  if (resMaterias.error) {
    toast('No se pudieron cargar las materias.');
    return;
  }
  listaMaterias = resMaterias.data || [];
  configurarPeriodos(resConfig.data?.cantidad_periodos);
  configurarMaterias(listaMaterias);

  if (paramPeriodo) document.getElementById('filtro-periodo').value = paramPeriodo;
  else if (resConfig.data?.periodo_actual) document.getElementById('filtro-periodo').value = String(resConfig.data.periodo_actual);

  if (paramMateria) document.getElementById('filtro-materia').value = paramMateria;

  if (paramTarea) {
    const selectorActividad = document.getElementById('filtro-actividad');
    selectorActividad.innerHTML = `<option value="${paramTarea}">Cargando...</option>`;
    selectorActividad.value = paramTarea;
  }

  await cargarPlanilla();

  if (paramMateria || paramPeriodo || paramTarea) {
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

function rellenarConUno() {
  const tareaId = document.getElementById('filtro-actividad').value;
  if (!tareaId) {
    toast('Selecciona una actividad para rellenar.');
    return;
  }
  if (!confirm('¿Seguro que deseas asignar un 1.0 a todos los estudiantes que no tengan nota en esta actividad?')) return;
  const celdas = document.querySelectorAll('.celda-nota');
  let cambiadas = 0;
  celdas.forEach(celda => {
    if (celda.dataset.tarea === String(tareaId)) {
      if (celda.textContent.trim() === '') {
        celda.textContent = '1.0';
        cambiadas++;
      }
    }
  });
  if (cambiadas > 0) {
    toast(`Se rellenaron ${cambiadas} notas con 1.0. No olvides guardar.`);
  } else {
    toast('No había celdas vacías para rellenar.');
  }
}

function copiarColumna() {
  const celdas = document.querySelectorAll('.celda-nota');
  if (celdas.length === 0) {
    toast('No hay notas para copiar.');
    return;
  }
  let texto = '';
  celdas.forEach(celda => {
    texto += celda.textContent.trim() + '\n';
  });
  navigator.clipboard.writeText(texto).then(() => {
    toast('<i data-lucide="check" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 5px;"></i> Columna copiada al portapapeles.');
    lucide.createIcons();
  }).catch(err => {
    toast('Error al copiar al portapapeles.');
  });
}

inicializarPlanilla();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
