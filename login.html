<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión · Mi Clase</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="app.js"></script>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: var(--bg);
  }
  .login-card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .login-card .brand-mark {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: inline-block;
  }
  .login-card h1 {
    font-size: 1.5rem;
    color: var(--text-dark);
    margin-bottom: 1.5rem;
  }
  .form-group {
    text-align: left;
    margin-bottom: 1rem;
  }
  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--text-dark);
  }
  .form-control {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
  }
  .btn-login {
    width: 100%;
    padding: 0.75rem;
    background-color: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-login:hover {
    background-color: var(--primary-dark);
  }
</style>
</head>
<body>
<div class="login-card">
  <i data-lucide="graduation-cap" class="brand-mark" style="width: 48px; height: 48px; color: var(--primary);"></i>
  <h1>Iniciar Sesión</h1>
  
  <form id="login-form">
    <div class="form-group">
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" class="form-control" placeholder="docente@escuela.edu" required>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login" id="btn-submit">
      <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
      Ingresar
    </button>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
  // Inicializar iconos de Lucide
  lucide.createIcons();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader" class="lucide-spin" style="width: 18px; height: 18px;"></i> Ingresando...';
    lucide.createIcons();

    const { data, error } = await clienteSupabaseCompartido.auth.signInWithPassword({
      email,
      password,
    });

    if (error) {
      mostrarToast('Error: ' + error.message);
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Ingresar';
      lucide.createIcons();
    } else {
      mostrarToast('Ingreso exitoso. Redirigiendo...');
      window.location.href = 'dashboard.html';
    }
  });

  // Redirigir si ya está logueado
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await clienteSupabaseCompartido.auth.getSession();
    if (session) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
</body>
</html>
